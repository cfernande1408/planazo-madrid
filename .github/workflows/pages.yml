name: Actualizar agenda y publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *" # cada día, 06:17 en Madrid en horario de verano
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Descargar agenda
        id: fetch
        continue-on-error: true # si falla, se publica la última agenda guardada
        run: python scripts/fetch_agenda.py

      - name: Guardar la agenda en el repo
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/data data
          if git diff --cached --quiet; then
            echo "Sin cambios en la agenda."
          else
            git commit -m "chore(data): actualizar agenda"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
