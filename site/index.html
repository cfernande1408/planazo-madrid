<style>
/* Layout: MD3 app — bottom nav bar on phones, nav rail on desktop; "Para ti" feed, month calendar + day agenda, interests. Rose seed, one tonal colour per activity type. */
:root{
  --primary:#B01E2F;--on-primary:#FFFFFF;--primary-container:#F1EAEA;--on-primary-container:#410008;
  --secondary-container:#ECE7E6;--on-secondary-container:#1F1B1B;
  --surface:#FCFBFB;--surface-low:#F6F4F4;--surface-c:#F0EDED;--surface-high:#EAE7E7;--surface-highest:#E4E1E1;
  --on-surface:#1C1B1B;--on-surface-var:#4F4848;--outline:#807676;--outline-var:#D3CCCC;
  --inverse-surface:#313030;--inverse-on:#F4F0F0;--scrim:rgba(28,27,27,.42);
  --hero-bg:#B01E2F;--hero-fg:#FFFFFF;--hero-accent:#FFC9A8;
  --leaf:#3E7B4F;--berry:#C8102E;--sun:#FFC9A8;--bear:#3A2B26;
  --font:"Roboto Flex",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  --cat-musica-bg:#E8DEFF;--cat-musica-fg:#21005D;--cat-musica-dot:#6750A4;
  --cat-escena-bg:#FFD8E4;--cat-escena-fg:#31111D;--cat-escena-dot:#984061;
  --cat-cine-bg:#D3E4FF;--cat-cine-fg:#001C38;--cat-cine-dot:#3A6EA5;
  --cat-expos-bg:#FFDBCB;--cat-expos-fg:#341100;--cat-expos-dot:#9A4521;
  --cat-letras-bg:#F6E388;--cat-letras-fg:#231B00;--cat-letras-dot:#7A6900;
  --cat-talleres-bg:#B8F0C8;--cat-talleres-fg:#00210E;--cat-talleres-dot:#2E7D4F;
  --cat-peques-bg:#FFDDB3;--cat-peques-fg:#2B1700;--cat-peques-dot:#8B5000;
  --cat-calle-bg:#F6D9FF;--cat-calle-fg:#30004A;--cat-calle-dot:#8A4AA0;
  --cat-deporte-bg:#BBEBEC;--cat-deporte-fg:#002020;--cat-deporte-dot:#006A6C;
  --cat-rutas-bg:#D7E8CD;--cat-rutas-fg:#121F0E;--cat-rutas-dot:#546347;
  --cat-otros-bg:#E3E1EC;--cat-otros-fg:#1A1B23;--cat-otros-dot:#5D5E67;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:#FFB3B0;--on-primary:#680014;--primary-container:#3A3131;--on-primary-container:#FFDAD8;
  --secondary-container:#3D3838;--on-secondary-container:#ECE7E6;
  --surface:#141313;--surface-low:#1C1B1B;--surface-c:#201F1F;--surface-high:#2B2929;--surface-highest:#363434;
  --on-surface:#E6E1E1;--on-surface-var:#D3CCCC;--outline:#9C9494;--outline-var:#4F4848;
  --inverse-surface:#E6E1E1;--inverse-on:#313030;--scrim:rgba(0,0,0,.6);
  --hero-bg:#7A1320;--hero-fg:#FFE9E8;--hero-accent:#F6E388;
  --leaf:#8FD8A6;--berry:#FF6B78;--sun:#F6E388;--bear:#E8D9CF;
  --cat-musica-bg:#4F378B;--cat-musica-fg:#E8DEFF;--cat-musica-dot:#D0BCFF;
  --cat-escena-bg:#633B48;--cat-escena-fg:#FFD8E4;--cat-escena-dot:#FFB0C9;
  --cat-cine-bg:#1F4876;--cat-cine-fg:#D3E4FF;--cat-cine-dot:#A2C9FF;
  --cat-expos-bg:#723610;--cat-expos-fg:#FFDBCB;--cat-expos-dot:#FFB691;
  --cat-letras-bg:#544600;--cat-letras-fg:#F6E388;--cat-letras-dot:#E0C750;
  --cat-talleres-bg:#0F5229;--cat-talleres-fg:#B8F0C8;--cat-talleres-dot:#8FD8A6;
  --cat-peques-bg:#653E00;--cat-peques-fg:#FFDDB3;--cat-peques-dot:#FFB95B;
  --cat-calle-bg:#5E2A72;--cat-calle-fg:#F6D9FF;--cat-calle-dot:#E8B3FF;
  --cat-deporte-bg:#004F51;--cat-deporte-fg:#BBEBEC;--cat-deporte-dot:#7FD5D7;
  --cat-rutas-bg:#3C4B35;--cat-rutas-fg:#D7E8CD;--cat-rutas-dot:#BBCCB2;
  --cat-otros-bg:#45464F;--cat-otros-fg:#E3E1EC;--cat-otros-dot:#C6C5D0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --primary:#FFB3B0;--on-primary:#680014;--primary-container:#3A3131;--on-primary-container:#FFDAD8;
  --secondary-container:#3D3838;--on-secondary-container:#ECE7E6;
  --surface:#141313;--surface-low:#1C1B1B;--surface-c:#201F1F;--surface-high:#2B2929;--surface-highest:#363434;
  --on-surface:#E6E1E1;--on-surface-var:#D3CCCC;--outline:#9C9494;--outline-var:#4F4848;
  --inverse-surface:#E6E1E1;--inverse-on:#313030;--scrim:rgba(0,0,0,.6);
  --hero-bg:#7A1320;--hero-fg:#FFE9E8;--hero-accent:#F6E388;
  --leaf:#8FD8A6;--berry:#FF6B78;--sun:#F6E388;--bear:#E8D9CF;
  --cat-musica-bg:#4F378B;--cat-musica-fg:#E8DEFF;--cat-musica-dot:#D0BCFF;
  --cat-escena-bg:#633B48;--cat-escena-fg:#FFD8E4;--cat-escena-dot:#FFB0C9;
  --cat-cine-bg:#1F4876;--cat-cine-fg:#D3E4FF;--cat-cine-dot:#A2C9FF;
  --cat-expos-bg:#723610;--cat-expos-fg:#FFDBCB;--cat-expos-dot:#FFB691;
  --cat-letras-bg:#544600;--cat-letras-fg:#F6E388;--cat-letras-dot:#E0C750;
  --cat-talleres-bg:#0F5229;--cat-talleres-fg:#B8F0C8;--cat-talleres-dot:#8FD8A6;
  --cat-peques-bg:#653E00;--cat-peques-fg:#FFDDB3;--cat-peques-dot:#FFB95B;
  --cat-calle-bg:#5E2A72;--cat-calle-fg:#F6D9FF;--cat-calle-dot:#E8B3FF;
  --cat-deporte-bg:#004F51;--cat-deporte-fg:#BBEBEC;--cat-deporte-dot:#7FD5D7;
  --cat-rutas-bg:#3C4B35;--cat-rutas-fg:#D7E8CD;--cat-rutas-dot:#BBCCB2;
  --cat-otros-bg:#45464F;--cat-otros-fg:#E3E1EC;--cat-otros-dot:#C6C5D0;
  color-scheme:dark}

*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{background:var(--surface);color:var(--on-surface)}
body{font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:22px;line-height:1;display:inline-block;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-variation-settings:'FILL' 0,'wght' 450,'GRAD' 0,'opsz' 24;-webkit-font-feature-settings:'liga';user-select:none;flex:none;width:1em;overflow:hidden}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
@media (min-width:900px){main{padding-left:112px;padding-right:24px;padding-bottom:48px}}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);padding-block:14px 10px;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--primary-container);color:var(--on-primary-container);display:grid;place-items:center;transform:rotate(-6deg)}
.madrono .lf{fill:var(--leaf)}.madrono .bry{fill:var(--berry)}.madrono .bear{fill:var(--bear);color:var(--bear)}.madrono .trunk{fill:var(--bear);opacity:.45}
.brand h1{margin:0;font-size:24px;line-height:1.1;font-weight:800;font-variation-settings:"wdth" 118,"opsz" 40;letter-spacing:-.01em}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--on-surface-var)}
.search{display:flex;align-items:center;gap:10px;height:52px;padding:0 6px 0 16px;border-radius:28px;background:var(--surface-high);color:var(--on-surface-var)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;color:var(--on-surface)}
.search input::placeholder{color:var(--on-surface-var)}
.search input::-webkit-search-cancel-button{display:none}

/* Banner */
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:20px;background:var(--surface-c);margin-block:4px 8px}
.banner .ms{color:var(--primary);margin-top:1px}
.banner p{margin:0;font-size:14px;color:var(--on-surface-var);flex:1;min-width:0}
.banner b{color:var(--on-surface)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 20px;border-radius:20px;border:0;font-weight:600;font-size:14px;letter-spacing:.01em;white-space:nowrap;text-decoration:none;position:relative;overflow:hidden}
.btn .ms{font-size:18px}
.btn.filled{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn.text{background:transparent;color:var(--primary);padding:0 12px}
.btn.outlined{background:transparent;color:var(--primary);border:1px solid var(--outline)}
.btn::after,.chip::after,.ev-main::after,.day::after,.icon-btn::after,.nav-item .pill::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s;border-radius:inherit;pointer-events:none}
.btn:hover::after,.chip:hover::after,.ev-main:hover::after,.day:hover::after,.icon-btn:hover::after,.nav-item:hover .pill::after{opacity:.08}
.icon-btn{width:40px;height:40px;border-radius:20px;border:0;background:transparent;color:var(--on-surface-var);display:grid;place-items:center;position:relative;flex:none}
.icon-btn.on{color:var(--primary)}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:4px 6px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--outline-var);background:var(--surface);color:var(--on-surface-var);font-size:14px;font-weight:550;white-space:nowrap;position:relative;flex:none}
.chip .ms{font-size:18px}
.chip[aria-pressed="true"]{background:var(--secondary-container);color:var(--on-secondary-container);border-color:transparent}
.chip.cat[aria-pressed="true"]{background:var(--c-bg);color:var(--c-fg)}
.chip select{appearance:none;border:0;background:transparent;font-weight:550;font-size:14px;outline:none;padding-right:2px;max-width:170px}
.chip select option{background:var(--surface);color:var(--on-surface)}

/* Section headings */
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h h2{margin:0;font-size:28px;line-height:1.1;font-weight:800;font-variation-settings:"wdth" 122,"opsz" 48;letter-spacing:-.015em;text-wrap:balance}
.sec-h .sub{font-size:13px;color:var(--on-surface-var);white-space:nowrap}
.sec-h.small h2{font-size:20px;font-variation-settings:"wdth" 112,"opsz" 32}

/* Hero */
.hero{margin-top:8px;padding:22px 20px;border-radius:28px;background:var(--hero-bg);color:var(--hero-fg);display:grid;gap:14px;position:relative;overflow:hidden}
.hero .eyebrow{font-size:13px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.hero h2{margin:0;font-size:clamp(28px,6vw,44px);line-height:1.02;font-weight:850;font-variation-settings:"wdth" 125,"opsz" 72;letter-spacing:-.02em;text-wrap:balance;max-width:16ch}
.hero .stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 10px;border-radius:999px;background:var(--surface);color:var(--on-surface);font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .ms{font-size:18px;color:var(--primary)}
.hero{padding-bottom:0}
.hero > :not(svg){position:relative;z-index:1}
.stars{position:absolute;top:18px;right:18px;width:58px;height:auto;fill:currentColor;opacity:.9}
.skyline{display:block;width:calc(100% + 40px);height:auto;margin:6px -20px 0;color:var(--hero-fg)}
.skyline .front{fill:currentColor;opacity:.92}
.skyline .back{fill:currentColor;opacity:.2}
.skyline .holes{fill:var(--hero-bg)}
.skyline .caps{fill:var(--hero-accent)}
.skyline .sun{fill:var(--sun)}
@media (min-width:700px){
  .hero{padding-bottom:22px;min-height:210px}
  .hero h2{max-width:13ch}
  .skyline{position:absolute;right:0;bottom:0;width:min(440px,52%);margin:0}
  .stars{top:22px;right:30px;width:64px}
}

/* Event cards */
.list{display:grid;gap:8px}
@media (min-width:700px){.list.two{grid-template-columns:1fr 1fr}}
.ev{display:flex;align-items:stretch;border-radius:22px;background:var(--surface-low);min-width:0}
.ev-main{flex:1;min-width:0;display:flex;gap:14px;align-items:flex-start;text-align:left;padding:14px 4px 14px 14px;border:0;background:transparent;border-radius:22px 0 0 22px;position:relative}
.ev-ic{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--bg);color:var(--fg);flex:none}
.ev-body{min-width:0;flex:1}
.ev-body h3{margin:0;font-size:15.5px;line-height:1.3;font-weight:650;overflow-wrap:anywhere}
.ev-meta{margin:3px 0 0;font-size:13.5px;color:var(--on-surface-var);overflow-wrap:anywhere}
.ev-meta .t{font-weight:700;color:var(--on-surface);font-variant-numeric:tabular-nums}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:8px;font-size:12px;font-weight:600;background:var(--surface-high);color:var(--on-surface-var)}
.tag.free{background:var(--cat-talleres-bg);color:var(--cat-talleres-fg)}
.tag.ex{background:transparent;border:1px dashed var(--outline);}
.tag .ms{font-size:14px}
.ev .icon-btn{align-self:center;margin-right:6px}
.more{margin-top:10px}

/* Carousel */
.rail-x{display:flex;gap:12px;overflow-x:auto;padding-block:2px 8px;margin-inline:-16px;padding-inline:16px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.card-x{flex:0 0 min(260px,78vw);scroll-snap-align:start;border-radius:24px;padding:16px;background:var(--bg);color:var(--fg);border:0;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:150px;position:relative}
.card-x h3{margin:0;font-size:17px;line-height:1.25;font-weight:700;font-variation-settings:"wdth" 110}
.card-x p{margin:0;font-size:13px;opacity:.85;margin-top:auto}

/* Empty */
.empty{padding:28px 20px;border-radius:24px;background:var(--surface-low);text-align:center;color:var(--on-surface-var)}
.empty .ms{font-size:40px;color:var(--primary)}
.empty p{margin:8px auto 0;max-width:36ch}

/* Calendar */
.cal-wrap{display:grid;gap:20px;margin-top:8px}
@media (min-width:900px){.cal-wrap{grid-template-columns:minmax(360px,440px) 1fr;align-items:start}.cal-side{position:sticky;top:150px}}
.cal{background:var(--surface-low);border-radius:28px;padding:14px 12px 16px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
.cal-head h2{margin:0;font-size:22px;font-weight:800;font-variation-settings:"wdth" 118,"opsz" 32;text-transform:capitalize}
.wd,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd span{text-align:center;font-size:12px;font-weight:700;color:var(--on-surface-var);padding:4px 0;letter-spacing:.04em}
.day{position:relative;border:0;background:transparent;border-radius:16px;aspect-ratio:1/1.05;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px;color:var(--on-surface)}
.day .num{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;width:30px;height:30px;display:grid;place-items:center;border-radius:12px}
.day.today .num{outline:2px solid var(--primary);outline-offset:-2px;color:var(--primary)}
.day.sel{background:var(--primary)}
.day.sel .num{color:var(--on-primary);outline:0}
.day.sel .dots i{box-shadow:0 0 0 1.5px var(--primary)}
.day.past{opacity:.38}
.day.out{visibility:hidden}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--d)}
.day .cnt{font-size:10.5px;font-weight:700;color:var(--on-surface-var);font-variant-numeric:tabular-nums;line-height:1}
.day.sel .cnt{color:var(--on-primary)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;padding:0 6px;font-size:12px;color:var(--on-surface-var)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--d)}
.slot-h{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--on-surface-var)}
.slot-h .ms{font-size:18px}
details.ongo{margin-top:18px;border-radius:22px;background:var(--surface-c);padding:4px 8px}
details.ongo summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 8px;font-weight:650;cursor:pointer}
details.ongo summary::-webkit-details-marker{display:none}
details.ongo summary .chev{margin-left:auto;transition:transform .2s}
details.ongo[open] summary .chev{transform:rotate(180deg)}
details.ongo .list{padding:0 0 8px}

/* Prefs */
.pcard{background:var(--surface-low);border-radius:28px;padding:20px;margin-top:16px}
.pcard h2{margin:0 0 4px;font-size:20px;font-weight:800;font-variation-settings:"wdth" 112,"opsz" 32}
.pcard > p{margin:0 0 14px;color:var(--on-surface-var);font-size:14px}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--outline-var)}
.sw-row:first-of-type{border-top:0}
.sw-row b{display:block;font-weight:600}
.sw-row small{color:var(--on-surface-var);font-size:13px}
.switch{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:16px;background:var(--surface-highest);border:2px solid var(--outline);position:relative;flex:none;cursor:pointer;transition:background .2s,border-color .2s;margin:0}
.switch::before{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--outline);top:6px;left:6px;transition:all .2s}
.switch:checked{background:var(--primary);border-color:var(--primary)}
.switch:checked::before{width:24px;height:24px;top:2px;left:22px;background:var(--on-primary)}

async function loadData(){
  try{
    const r=await fetch('data/agenda.json',{cache:'no-cache'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(!d||!Array.isArray(d.events)||!d.events.length)throw new Error('vacío');
    state.data={source:'oficial',generatedAt:Date.parse(d.generatedAt)||Date.now(),count:d.events.length,sources:d.sources||null};
    setEvents(d.events);
  }catch(e){state.data={source:'ejemplo'};setEvents(examples())}
}
function setEvents(evs){
  state.events=evs;state.map=new Map(evs.map(e=>[e.id,e]));
  const t=today0();const horizon=addDays(t,120);
  const byDay=new Map();const ongoing=[];let maxK=keyOf(t);
  for(const ev of evs){
    const s=parseKey(ev.start),e=parseKey(ev.end||ev.start);
    if(e<t)continue;
    const span=(e-s)/864e5;
    ev.long=!!ev.longHint||(!ev.days&&span>14);
    if(ev.long){ongoing.push(ev);continue}
    const days=ev.days?new Set(ev.days):null;const excl=new Set(ev.excl||[]);
    const stop=e>horizon?horizon:e;
    for(let d=s<t?new Date(t):new Date(s);d<=stop;d=addDays(d,1)){
      const k=keyOf(d);if(excl.has(k))continue;if(days&&!days.has(d.getDay()))continue;
      if(!byDay.has(k))byDay.set(k,[]);byDay.get(k).push(ev);if(k>maxK)maxK=k;
    }
  }
  for(const l of byDay.values())l.sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
  state.byDay=byDay;state.ongoing=ongoing;state.maxKey=maxK;
  const tk=keyOf(t);state.cal.sel=tk;state.cal.month=new Date(t.getFullYear(),t.getMonth(),1);
}

/* ---------- matching ---------- */
function inCats(ev,set){return set.has(ev.cat)||(set.has('peques')&&ev.kids)}
function matchQ(ev){if(!state.q)return true;const q=norm(state.q);return norm(ev.title+' '+ev.venue+' '+ev.district+' '+(ev.town||'')+' '+CAT[ev.cat].name).includes(q)}
function matchesPrefs(ev){
  const p=state.prefs;
  if(p.cats.length&&!inCats(ev,new Set(p.cats)))return false;
  if(p.freeOnly&&!ev.free)return false;
  if(ev.town&&!p.towns)return false;
  if(p.slots.length&&ev.time&&!p.slots.includes(slotOf(ev.time)))return false;
  return true;
}
function score(ev){const p=state.prefs;let s=0;if(p.cats.length&&inCats(ev,new Set(p.cats)))s+=3;if(p.districts.includes(ev.district))s+=2;if(ev.free)s+=1;if(p.kids&&ev.kids)s+=2;if(state.saved.has(ev.id))s+=5;return s}
function passCal(ev){
  const c=state.cal;
  if(!matchQ(ev))return false;if(c.free&&!ev.free)return false;if(ev.town&&!c.towns)return false;if(c.district&&ev.district!==c.district)return false;
  if(c.cats.size&&!inCats(ev,c.cats))return false;if(c.mine&&!matchesPrefs(ev))return false;return true;
}
const dayEvents=k=>(state.byDay.get(k)||[]);
const ongoingOn=k=>{const wd=parseKey(k).getDay();return state.ongoing.filter(e=>e.start<=k&&e.end>=k&&(!e.days||e.days.includes(wd))&&!(e.excl||[]).includes(k))};

/* ---------- formatting ---------- */
function daysText(days){
  if(!days||days.length>=7)return'todos los días';
  const missing=[0,1,2,3,4,5,6].filter(d=>!days.includes(d));
  if(missing.length===1)return'cerrado los '+WD_NAME[missing[0]];
  const names=days.map(d=>WD_NAME[d]);return names.length>1?names.slice(0,-1).join(', ')+' y '+names[names.length-1]:names[0];
}
function whenText(ev,k){
  if(ev.long)return'Del '+fmtDM.format(parseKey(ev.start))+' al '+fmtDM.format(parseKey(ev.end))+(ev.days?' · '+daysText(ev.days):'')+(ev.time?' · '+ev.time:'');
  if(ev.days){const names=ev.days.map(d=>WD_NAME[d]);const j=names.length>1?names.slice(0,-1).join(', ')+' y '+names[names.length-1]:names[0];return cap(j)+', hasta el '+fmtDM.format(parseKey(ev.end))+(ev.time?' · '+ev.time:'')}
  if(ev.start!==ev.end)return'Del '+fmtDM.format(parseKey(ev.start))+' al '+fmtDM.format(parseKey(ev.end))+(ev.time?' · '+ev.time:'');
  return cap(fmtLong.format(parseKey(k||ev.start)))+(ev.time?' · '+ev.time:'');
}
function priceTag(ev){return ev.free?'<span class="tag free"><span class="ms">redeem</span>Gratis</span>':(ev.price?'<span class="tag">'+esc(ev.price.length>22?ev.price.slice(0,22)+'…':ev.price)+'</span>':'')}
function catVars(id){return`--bg:var(--cat-${id}-bg);--fg:var(--cat-${id}-fg)`}
function evCard(ev,opts){
  opts=opts||{};const c=CAT[ev.cat];const sv=state.saved.has(ev.id);
  const meta=[ev.time&&!opts.noTime?'<span class="t">'+esc(ev.time)+'</span>':'',opts.showDay?esc(cap(fmtShort.format(parseKey(opts.showDay)))):'',esc(ev.venue),ev.town?esc(ev.town):(ev.district&&!norm(ev.venue).includes(norm(ev.district))?esc(ev.district):'')].filter(Boolean).join(' · ');
  const tags=[priceTag(ev),ev.kids?'<span class="tag"><span class="ms">child_care</span>Con peques</span>':'',ev.source==='cam'?'<span class="tag">Comunidad</span>':'',ev.sample?'<span class="tag ex">Ejemplo</span>':''].join('');
  return`<article class="ev"><button class="ev-main" data-act="open" data-id="${esc(ev.id)}" data-k="${esc(opts.k||'')}"><span class="ev-ic" style="${catVars(ev.cat)}"><span class="ms">${c.icon}</span></span><span class="ev-body"><h3>${esc(ev.title)}</h3><p class="ev-meta">${meta}</p>${tags?'<span class="tags">'+tags+'</span>':''}</span></button><button class="icon-btn${sv?' on':''}" data-act="save" data-id="${esc(ev.id)}" aria-label="${sv?'Quitar de guardados':'Guardar'}" aria-pressed="${sv}"><span class="ms${sv?' fill':''}">bookmark</span></button></article>`;
}

/* ---------- views ---------- */
function renderBanner(){

  if(d.source==='ejemplo'){
    b.innerHTML=`<div class="banner"><span class="ms">science</span><p><b>Estás viendo datos de ejemplo.</b> Todavía no hay agenda descargada; aparecerá en cuanto se ejecute la actualización diaria.</p></div>`;
    $('#status').textContent='Datos de ejemplo';return;

function section(id,title,sub,items,opts){
  if(!items.length)return'';
  const lim=6;const open=state.expanded.has(id);const shown=open?items:items.slice(0,lim);
  let more='';
  if(items.length>lim&&!open){more=opts&&opts.dayKey?`<button class="btn text more" data-act="goday" data-k="${opts.dayKey}">Ver los ${items.length} en el calendario<span class="ms">arrow_forward</span></button>`:`<button class="btn text more" data-act="expand" data-s="${id}">Ver ${items.length-lim} más<span class="ms">expand_more</span></button>`}
  return`<div class="sec"><div class="sec-h${opts&&opts.small?' small':''}"><h2>${title}</h2><span class="sub">${sub||''}</span></div><div class="list two">${shown.map(x=>evCard(x.ev,{showDay:x.showDay,k:x.k})).join('')}</div>${more}</div>`;
}
function rankDay(k,shown){
  return dayEvents(k).filter(e=>!shown.has(e.id)&&matchQ(e)&&matchesPrefs(e)).sort((a,b)=>score(b)-score(a)||(a.time||'99').localeCompare(b.time||'99'));
}
function renderParaTi(){
  const t=today0();const tk=keyOf(t);const p=state.prefs;
  const todayAll=dayEvents(tk).filter(matchQ);
  const todayMine=todayAll.filter(matchesPrefs);
  const freeToday=todayMine.filter(e=>e.free).length;
  const hasPrefs=p.cats.length||p.districts.length||p.slots.length||p.freeOnly||p.kids;
  let h=`<div class="hero">${STARS}
    <span class="eyebrow">${esc(fmtLong.format(t))}</span>
    <h2>${state.q?'Resultados para «'+esc(state.q)+'»':(hasPrefs?'Tus planes en Madrid':'Qué pasa hoy en Madrid')}</h2>
    <div class="stats"><span class="stat"><span class="ms">event</span>${nf.format(todayMine.length)} planes hoy</span><span class="stat"><span class="ms">redeem</span>${nf.format(freeToday)} gratis</span>${state.saved.size?`<span class="stat"><span class="ms fill">bookmark</span>${state.saved.size} guardados</span>`:''}</div>${SKYLINE}</div>`;
  if(!hasPrefs&&!state.q){h+=`<div class="sec"><div class="banner"><span class="ms">tune</span><p><b>Dime qué te gusta</b> y ordeno la agenda por ti: tipos de plan, tus barrios y a qué hora te viene bien.</p><button class="btn tonal" data-act="view" data-v="prefs">Elegir</button></div></div>`}

  // saved upcoming
  const sv=[];const seenSv=new Set();
  for(let i=0;i<60&&sv.length<12;i++){const k=keyOf(addDays(t,i));for(const e of dayEvents(k))if(state.saved.has(e.id)&&!seenSv.has(e.id)&&matchQ(e)){seenSv.add(e.id);sv.push({ev:e,showDay:k,k})}}
  state.ongoing.forEach(e=>{if(state.saved.has(e.id)&&!seenSv.has(e.id)&&matchQ(e))sv.push({ev:e})});
  h+=section('saved','Guardados','',sv,{small:true});

  const shown=new Set();
  const take=(k,label)=>{const r=rankDay(k,shown);r.forEach(e=>shown.add(e.id));return r.map(e=>({ev:e,k}))};
  const hoy=take(tk);h+=section('hoy','Hoy',hoy.length?hoy.length+' planes':'',hoy,{dayKey:tk});
  const mk=keyOf(addDays(t,1));const man=take(mk);h+=section('man','Mañana',cap(fmtShort.format(addDays(t,1))),man,{dayKey:mk});
  const dow=t.getDay();const sat=(6-dow+7)%7;
  const wk=[sat,sat+1].filter(o=>o>1);
  let finde=[];wk.forEach(o=>{const k=keyOf(addDays(t,o));finde=finde.concat(take(k).map(x=>({ev:x.ev,showDay:k,k})))});
  finde.sort((a,b)=>score(b.ev)-score(a.ev));
  h+=section('finde','Este finde',wk.length?fmtDM.format(addDays(t,wk[0]))+(wk.length>1?' – '+fmtDM.format(addDays(t,wk[1])):''):'',finde);
  if(p.districts.length){
    let bar=[];for(let i=0;i<8;i++){const k=keyOf(addDays(t,i));dayEvents(k).forEach(e=>{if(p.districts.includes(e.district)&&!shown.has(e.id)&&matchQ(e)&&matchesPrefs(e)){shown.add(e.id);bar.push({ev:e,showDay:k,k})}})}
    h+=section('barrio','En tus barrios',p.districts.slice(0,3).join(', ')+(p.districts.length>3?'…':''),bar);
  }
  let sem=[];for(let i=2;i<8;i++){if(wk.includes(i))continue;const k=keyOf(addDays(t,i));sem=sem.concat(take(k).map(x=>({ev:x.ev,showDay:k,k})))}
  h+=section('sem','Esta semana','próximos 7 días',sem);

  const ong=state.ongoing.filter(e=>e.start<=keyOf(addDays(t,7))&&matchQ(e)&&matchesPrefs(e)).sort((a,b)=>score(b)-score(a)).slice(0,14);
  if(ong.length){h+=`<div class="sec"><div class="sec-h small"><h2>Para ver con calma</h2><span class="sub">exposiciones y cosas que duran</span></div><div class="rail-x">${ong.map(e=>`<button class="card-x" data-act="open" data-id="${esc(e.id)}" style="${catVars(e.cat)}"><span class="ms">${CAT[e.cat].icon}</span><h3>${esc(e.title)}</h3><p>Hasta el ${esc(fmtDM.format(parseKey(e.end)))} · ${esc(e.venue)}${e.free?' · Gratis':''}</p></button>`).join('')}</div></div>`}
  if(!hoy.length&&!man.length&&!finde.length&&!sem.length&&!ong.length){h+=`<div class="sec"><div class="empty"><span class="ms">search_off</span><p>No hay planes que encajen${state.q?' con esa búsqueda':' con tus intereses'} en los próximos días. Prueba a quitar algún filtro.</p></div></div>`}
  $('#v-parati').innerHTML=h;
}

function renderCal(){
  const c=state.cal;const t=today0();const tk=keyOf(t);
  const m=c.month;const first=new Date(m.getFullYear(),m.getMonth(),1);
  const lead=(first.getDay()+6)%7;const dim=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
  const minM=new Date(t.getFullYear(),t.getMonth(),1);const maxD=parseKey(state.maxKey);const maxM=new Date(maxD.getFullYear(),maxD.getMonth(),1);
  let cells='';
  for(let i=0;i<lead;i++)cells+='<span class="day out" aria-hidden="true"></span>';
  for(let d=1;d<=dim;d++){
    const dt=new Date(m.getFullYear(),m.getMonth(),d);const k=keyOf(dt);
    const evs=dayEvents(k).filter(passCal);
    const cats=[...new Set(evs.map(e=>e.cat))].slice(0,4);
    const cls=['day',k===tk?'today':'',k===c.sel?'sel':'',k<tk?'past':''].join(' ');

  const distSel=`<label class="chip" ${c.district?'aria-pressed="true"':''}><span class="ms">location_on</span><select id="caldist" aria-label="Distrito"><option value="">Todos los distritos</option>${DIST_LIST.map(d=>`<option${d===c.district?' selected':''}>${esc(d)}</option>`).join('')}</select></label>`;
  const filters=`<div class="chips" role="toolbar" aria-label="Filtros">${chip('calmine','Mis intereses',c.mine,'auto_awesome')}${chip('calfree','Gratis',c.free,'redeem')}${chip('caltowns','Otros municipios',c.towns,'map')}${distSel}${CATS.filter(x=>x.id!=='otros').map(x=>`<button class="chip cat" style="--c-bg:var(--cat-${x.id}-bg);--c-fg:var(--cat-${x.id}-fg)" data-act="calcat" data-c="${x.id}" aria-pressed="${c.cats.has(x.id)}"><span class="ms">${c.cats.has(x.id)?'check':x.icon}</span>${x.name}</button>`).join('')}</div>`;

  // day list
  const sel=c.sel;const evs=dayEvents(sel).filter(passCal);
  const groups={manana:[],tarde:[],noche:[],'':[]};evs.forEach(e=>groups[slotOf(e.time)].push(e));
  let list='';
  for(const s of SLOTS)if(groups[s.id].length)list+=`<div class="slot-h"><span class="ms">${s.icon}</span>${s.name} · ${groups[s.id].length}</div><div class="list">${groups[s.id].map(e=>evCard(e,{k:sel})).join('')}</div>`;
  if(groups[''].length)list+=`<div class="slot-h"><span class="ms">schedule</span>Todo el día u horario por confirmar · ${groups[''].length}</div><div class="list">${groups[''].map(e=>evCard(e,{k:sel})).join('')}</div>`;
  if(!evs.length)list=`<div class="empty"><span class="ms">event_busy</span><p>${sel<tk?'Este día ya ha pasado.':'No hay actividades con estos filtros este día.'}</p></div>`;
  const ong=ongoingOn(sel).filter(passCal);
  if(ong.length)list+=`<details class="ongo"><summary><span class="ms">palette</span>También abiertas este día · ${ong.length}<span class="ms chev">expand_more</span></summary><div class="list">${ong.map(e=>evCard(e,{k:sel})).join('')}</div></details>`;
  const usedCats=[...new Set(dayEvents(sel).map(e=>e.cat))];
  $('#v-cal').innerHTML=`${filters}<div class="cal-wrap"><div class="cal-side"><div class="cal"><div class="cal-head"><button class="icon-btn" data-act="mprev" aria-label="Mes anterior"${m<=minM?' disabled style="opacity:.3"':''}><span class="ms">chevron_left</span></button><h2>${esc(fmtMonth.format(m))}</h2><button class="icon-btn" data-act="mnext" aria-label="Mes siguiente"${m>=maxM?' disabled style="opacity:.3"':''}><span class="ms">chevron_right</span></button></div><div class="wd" aria-hidden="true"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div><div class="grid">${cells}</div>${usedCats.length?`<div class="legend">${usedCats.map(x=>`<span><i style="--d:var(--cat-${x}-dot)"></i>${CAT[x].name}</span>`).join('')}</div>`:''}</div></div><div id="daylist"><div class="sec-h" style="margin-top:4px"><h2>${esc(cap(fmtLong.format(parseKey(sel))))}</h2><span class="sub">${evs.length} actividades</span></div>${list}</div></div>`;
}

const sheet=$('#sheet');
function gcalLink(ev,k){

  else{const nx=keyOf(addDays(parseKey(k||ev.start),1)).replace(/-/g,'');dates=day+'/'+nx}
  return'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(ev.title)+'&dates='+dates+'&ctz=Europe/Madrid&location='+encodeURIComponent(ev.venue+(ev.district?', '+ev.district:'')+', Madrid')+(ev.link?'&details='+encodeURIComponent(ev.link):'');

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;const p=state.prefs;
  const tog=(arr,v)=>{const i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v)};
  switch(a){
    case'view':state.view=el.dataset.v;render();window.scrollTo(0,0);
      if(el.dataset.focus==='data'){const dc=$('#datacard');if(dc)dc.scrollIntoView({block:'start'})}break;
    case'open':openSheet(el.dataset.id,el.dataset.k);break;
    case'close':sheet.close();break;
    case'save':{const id=el.dataset.id;const had=state.saved.has(id);had?state.saved.delete(id):state.saved.add(id);saveSaved();
      toast(had?'Quitado de guardados':'Guardado');render();if(el.dataset.insheet&&sheet.open)openSheet(id,sheet.dataset.k);break}
    case'expand':state.expanded.add(el.dataset.s);renderParaTi();break;
    case'goday':{const k=el.dataset.k;state.cal.sel=k;const d=parseKey(k);state.cal.month=new Date(d.getFullYear(),d.getMonth(),1);state.cal.mine=true;state.view='cal';render();window.scrollTo(0,0);break}
    case'day':state.cal.sel=el.dataset.k;renderCal();if(window.innerWidth<900){const dl=$('#daylist');if(dl)dl.scrollIntoView({block:'start',behavior:'smooth'})}break;
    case'mprev':case'mnext':{const m=state.cal.month;state.cal.month=new Date(m.getFullYear(),m.getMonth()+(a==='mprev'?-1:1),1);renderCal();break}
    case'calmine':state.cal.mine=!state.cal.mine;renderCal();break;
    case'calfree':state.cal.free=!state.cal.free;renderCal();break;
    case'caltowns':state.cal.towns=!state.cal.towns;renderCal();break;
    case'calcat':{const c=el.dataset.c;state.cal.cats.has(c)?state.cal.cats.delete(c):state.cal.cats.add(c);renderCal();break}
    case'pcat':tog(p.cats,el.dataset.val);savePrefs();renderPrefs();break;
    case'pdist':tog(p.districts,el.dataset.val);savePrefs();renderPrefs();break;
    case'pslot':tog(p.slots,el.dataset.val);savePrefs();renderPrefs();break;
    case'clearsaved':state.saved.clear();saveSaved();renderPrefs();toast('Guardados vaciados');break;
    case'qclear':$('#q').value='';state.q='';$('#qclear').hidden=true;render();break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='caldist'){state.cal.district=t.value;renderCal()}
  else if(t.id==='pfree'){state.prefs.freeOnly=t.checked;savePrefs()}
  else if(t.id==='pkids'){state.prefs.kids=t.checked;savePrefs()}
  else if(t.id==='ptowns'){state.prefs.towns=t.checked;state.cal.towns=t.checked;savePrefs()}
});
let qt;$('#q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{state.q=e.target.value.trim();$('#qclear').hidden=!state.q;state.expanded.clear();render()},140)});
setEvents([]);render();loadData().then(render);
})();
</script>
</body>
</html>
